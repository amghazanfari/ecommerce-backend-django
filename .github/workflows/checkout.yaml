name: Checkout

on:
  - push

jobs:
  checkout_and_display_files:
    runs-on: ubuntu-latest
    steps:
      - name: list file before
        run: ls -a
      - name: checkout
        run: |
          git init
          git remote add origin "https://$GITHUB_ACTOR:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY.git"
          git fetch
          git checkout main
          ls -a
