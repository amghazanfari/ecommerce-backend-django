name: first action
on:
  - push

jobs:
  first_action:
    runs-on: ubuntu-latest
    steps:
      - name: simple js action
        id: greet
        uses: actions/hello-world-javascript-action@v1.1
        with:
          who-to-greet: Amir
      - name: output
        run: echo "${{ steps.greet.outputs.time }}"
