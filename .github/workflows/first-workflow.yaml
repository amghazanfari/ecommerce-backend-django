name: First workflow

on:
  - push

jobs:
  run-shell-command:
    runs-on: ubuntu-latest
    steps:
      - name: echo a string
        run: echo "hello world"
      - name: multiline command
        run: |
          node -v
          npm -v

  parallel-jobs-macos:
    runs-on: macos-latest
    steps:
      - name: View sw version
        run: sw_vers

  dependant-job:
    runs-on: windows-latest
    needs:
      - run-shell-command
    steps:
      - name: echo a string
        run: Write-Output "windows string"
      - name: Error step
        run: doesnotexists
